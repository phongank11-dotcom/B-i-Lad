
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>LAB 02</title>
</head>
<body>

    <h1>LAB 02 - JAVASCRIPT</h1>

    <script>
        // BÀI 1: KIỂM TRA SỐ CHẴN LẺ
        document.write("<h2>Bài 1: Kiểm tra số chẵn lẻ</h2>");

        let n = Number(prompt("Bài 1: Nhập số nguyên n:"));

        if (n % 2 == 0) {
            document.write(n + " là số chẵn<br>");
        } else {
            document.write(n + " là số lẻ<br>");
        }


        // BÀI 2: TÍNH TIỀN ĐIỆN
        document.write("<h2>Bài 2: Tính tiền điện</h2>");

        let kwh = Number(prompt("Bài 2: Nhập số điện đã sử dụng:"));
        let tien = 0;

        if (kwh < 0) {
            document.write("Số điện không hợp lệ<br>");
        } else {
            if (kwh <= 50) {
                tien = kwh * 1800;
            } else if (kwh <= 100) {
                tien = 50 * 1800 + (kwh - 50) * 2300;
            } else {
                tien = 50 * 1800 + 50 * 2300 + (kwh - 100) * 3000;
            }

            document.write("Tiền điện: " + tien + " VNĐ<br>");
        }

        let soDien = 100 + (910000 - 90000 - 115000) / 3000;

        document.write("910.000 VNĐ tương ứng " + soDien + " kWh<br>");


        // BÀI 3: TÍNH LƯƠNG NHÂN VIÊN
        document.write("<h2>Bài 3: Tính lương nhân viên</h2>");

        let chucvu = prompt("Bài 3: Nhập chức vụ (intern, staff, senior, manager):");
        let ngaycong = Number(prompt("Nhập số ngày công:"));
        let heso = 0;

        switch (chucvu) {
            case "intern":
                heso = 1;
                break;

            case "staff":
                heso = 1.5;
                break;

            case "senior":
                heso = 2;
                break;

            case "manager":
                heso = 3;
                break;

            default:
                document.write("Chức vụ không hợp lệ<br>");
        }

        if (heso != 0) {
            let luong = heso * ngaycong * 5000000 / 24;
            document.write("Lương nhân viên: " + luong + " VNĐ<br>");
        }


        // BÀI 4: BẢNG CỬU CHƯƠNG
        document.write("<h2>Bài 4: Bảng cửu chương từ 2 đến 9</h2>");

        for (let i = 2; i <= 9; i++) {
            document.write("<h3>Bảng nhân " + i + "</h3>");

            for (let j = 1; j <= 10; j++) {
                document.write(i + " x " + j + " = " + (i * j) + "<br>");
            }
        }


        // BÀI 5: KIỂM TRA SỐ NGUYÊN TỐ
        document.write("<h2>Bài 5: Kiểm tra số nguyên tố</h2>");

        let a = Number(prompt("Bài 5: Nhập số nguyên a:"));
        let dem = 0;

        if (a < 2 || !Number.isInteger(a)) {
            document.write(a + " không phải số nguyên tố");
        } else {
            for (let i = 1; i <= a; i++) {
                if (a % i == 0) {
                    dem++;
                }
            }

            if (dem == 2) {
                document.write(a + " là số nguyên tố");
            } else {
                document.write(a + " không phải số nguyên tố");
            }
        }

    </script>

</body>
</html>
